# /etc/nginx/sites-available/analytics.valemilk.com.br
#
# Proxy para o frontend Docker (porta 8082) e backend (porta 3001)
# Aplicar no servidor: sudo ln -s /etc/nginx/sites-available/analytics.valemilk.com.br.conf /etc/nginx/sites-enabled/
# SSL:  sudo certbot --nginx -d analytics.valemilk.com.br

server {
    listen 80;
    server_name analytics.valemilk.com.br;

    # Redireciona tudo para HTTPS (ativo após certbot)
    # return 301 https://$host$request_uri;

    # ── Frontend (React via Docker) ──────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── API Backend (Node.js) ────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

