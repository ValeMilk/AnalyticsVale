# Cópia de referência do /opt/analyticsVale/docker-compose.override.yml usado na VPS 72.61.62.17.
# O Compose carrega docker-compose.override.yml automaticamente junto com docker-compose.yml.
# O arquivo real não é versionado (está no .gitignore) porque descreve só aquele servidor.
services:
  backend:
    # A API fica acessível só pelo host; o nginx do container frontend faz o proxy de /api.
    ports: !override
      - "127.0.0.1:3001:3001"
    # Rede onde vivem o Postgres bi_cometa_db (porta 5432) e a API Infomarket bi_cometa_api (8000).
    networks:
      - cometa-net
      - bi-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  bi-net:
    external: true
    name: docker_bi_network
